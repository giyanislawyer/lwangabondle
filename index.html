<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 2 Year Anniversary 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --blur:blur(30px) saturate(1.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:#000;color:#fff;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
.wall{position:fixed;inset:0;background-size:cover;background-position:center;background-image:var(--wall)}
.wall.fallback{background:radial-gradient(at 20% 20%,#ffb3c7 0,transparent 50%),radial-gradient(at 80% 30%,#a18cd1 0,transparent 50%),radial-gradient(at 50% 90%,#5b86e5 0,transparent 55%),#2b1a4a}
svg{display:block}

/* ================= LOGIN ================= */
#login{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,transform .8s}
#login .wall{filter:blur(24px) brightness(.75) saturate(1.2);transform:scale(1.12)}
#login.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.login-clock{position:absolute;top:7vh;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.login-clock .d{font-size:22px;font-weight:500;opacity:.95}
.login-clock .t{font-size:96px;font-weight:700;line-height:1.05;letter-spacing:-2px}
.login-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14vh}
.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(160deg,#e9e9ee,#9ea0ab);display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.uname{font-size:19px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.4);margin-bottom:2px}
.pw-wrap{position:relative;display:flex;align-items:center}
#pw{width:200px;padding:6px 34px 6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.25);color:#fff;font-size:13px;outline:none;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);user-select:text;-webkit-user-select:text;font-family:var(--font)}
#pw::placeholder{color:rgba(255,255,255,.8)}
#pw:focus{background:rgba(255,255,255,.32)}
#go{position:absolute;right:4px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hint{font-size:12px;color:rgba(255,255,255,.9);min-height:16px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.touchid{font-size:12px;color:rgba(255,255,255,.75);margin-top:-2px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.login-bottom{position:absolute;bottom:34px;display:flex;gap:44px;font-size:12px;color:rgba(255,255,255,.9);text-align:center}
.login-bottom div{display:flex;flex-direction:column;align-items:center;gap:6px}
.login-bottom i{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;backdrop-filter:blur(20px)}

/* ================= DESKTOP ================= */
#desktop{position:fixed;inset:0;opacity:0;transition:opacity .9s;pointer-events:none;overflow:hidden}
#desktop.show{opacity:1;pointer-events:auto}
.menubar{position:absolute;top:0;left:0;right:0;height:25px;background:rgba(40,40,45,.28);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:500;z-index:3000;transition:transform .3s;text-shadow:0 0 1px rgba(0,0,0,.3)}
body.fs .menubar{transform:translateY(-100%)}
.mb-l,.mb-r{display:flex;align-items:center;height:100%}
.mb-i{padding:0 9px;height:21px;display:flex;align-items:center;border-radius:5px;cursor:default}
.mb-i:hover,.mb-i.on{background:rgba(255,255,255,.22)}
.mb-i b{font-weight:700}
.mb-r .mb-i{padding:0 6px}
@media(max-width:700px){.mb-l .opt{display:none}.mb-r .hide-s{display:none}}
.dropdown{position:absolute;top:26px;left:6px;min-width:230px;padding:5px;border-radius:10px;background:rgba(50,50,56,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid rgba(255,255,255,.2);box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:3100;display:none;font-size:13px}
.dropdown.open{display:block}
.dropdown div{padding:4px 12px;border-radius:5px;cursor:default}
.dropdown div:hover{background:#0a63d8}
.dropdown hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:5px 8px}

/* desktop icons */
.icons{position:absolute;top:40px;left:8px;bottom:110px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.icon{width:86px;padding:4px 2px;text-align:center;border-radius:6px;cursor:default}
.icon .g{width:56px;height:56px;margin:0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.icon .g svg{width:100%;height:100%}
.icon .n{font-size:12px;margin-top:4px;padding:1px 5px;border-radius:4px;display:inline-block;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.75);font-weight:500}
.icon.sel .g{opacity:.85}
.icon.sel .n{background:#0a63d8;text-shadow:none}
.icon.sel{background:rgba(255,255,255,.12)}

/* widget */
.widget{position:absolute;top:36px;right:14px;width:230px;padding:14px 16px;border-radius:22px;background:rgba(245,245,250,.5);color:#1d1d1f;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid rgba(255,255,255,.5);box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:10}
.widget h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#d70a53;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.cd{display:flex;justify-content:space-between;text-align:center}
.cd div{flex:1}
.cd b{display:block;font-size:28px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cd small{font-size:9.5px;text-transform:uppercase;color:#555;font-weight:600}
.widget p{font-size:11px;margin-top:8px;color:#555}
.together{font-size:12px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.12);font-weight:500}
@media(max-width:700px){.widget{width:180px;padding:10px;right:8px}.cd b{font-size:20px}}

/* ================= DOCK ================= */
.dock-wrap{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;z-index:2500;pointer-events:none;transition:transform .35s}
body.fs .dock-wrap{transform:translateY(130%)}
.dock{pointer-events:auto;display:flex;align-items:flex-end;gap:7px;padding:7px 8px;border-radius:24px;background:rgba(255,255,255,.22);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:.5px solid rgba(255,255,255,.45);box-shadow:0 10px 35px rgba(0,0,0,.3),inset 0 .5px 0 rgba(255,255,255,.4)}
.app{position:relative;width:var(--sz,58px);height:var(--sz,58px);flex:none;cursor:default;transition:width .12s ease-out,height .12s ease-out;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.app svg{width:100%;height:100%}
.app::after{content:attr(data-n);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 12px;border-radius:7px;background:rgba(60,60,66,.82);backdrop-filter:blur(20px);color:#fff;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .12s;filter:none}
.app:hover::after{opacity:1}
.app.open::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 2px rgba(0,0,0,.4)}
.app.bounce{animation:bounce .55s ease-out 2}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.dsep{width:1px;align-self:stretch;margin:4px 3px;background:rgba(255,255,255,.4);flex:none}
.dsep.hidden{display:none}
.mini svg{border-radius:22%}
.mini-wrap{display:flex;gap:7px;align-items:flex-end}

/* ================= WINDOWS ================= */
.win{position:absolute;display:none;flex-direction:column;background:#fff;color:#1d1d1f;border-radius:11px;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 22px 70px rgba(0,0,0,.5);overflow:hidden;min-width:300px;min-height:180px;resize:both;transform-origin:center;transition:transform .35s cubic-bezier(.3,.9,.3,1),opacity .3s,box-shadow .2s}
.win.open{display:flex;animation:winin .25s ease-out}
@keyframes winin{from{transform:scale(.92);opacity:0}}
.win.inactive{box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.28)}
.win.mini-anim{transform:scale(.06) translateY(40px);opacity:0;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s;resize:none}
.titlebar{height:38px;flex:none;background:rgba(246,246,248,.92);backdrop-filter:var(--blur);display:flex;align-items:center;padding:0 13px;border-bottom:.5px solid rgba(0,0,0,.18);position:relative;touch-action:none;z-index:2}
.win.dark .titlebar{background:rgba(38,38,40,.95);border-bottom-color:rgba(0,0,0,.6)}
.win.dark{color:#fff}
.titlebar .t{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#3a3a3c;pointer-events:none;letter-spacing:.1px}
.win.dark .titlebar .t{color:#e5e5e7}
.win.inactive .titlebar .t{opacity:.5}
.lights{display:flex;gap:8px;z-index:2}
.lights i{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:800;color:transparent;cursor:default;border:.5px solid rgba(0,0,0,.15);line-height:1}
.lights .c{background:#ff5f57}.lights .m{background:#febc2e}.lights .z{background:#28c840}
.lights:hover i{color:rgba(0,0,0,.55)}
.lights i::after{content:attr(data-g)}
.win.inactive .lights i{background:#cfcfd2;border-color:rgba(0,0,0,.12)}
.win.inactive .lights:hover .c{background:#ff5f57}.win.inactive .lights:hover .m{background:#febc2e}.win.inactive .lights:hover .z{background:#28c840}
.body{flex:1;overflow:auto;user-select:text;-webkit-user-select:text;min-height:0;position:relative}
.win.max{left:0!important;top:25px!important;width:100%!important;height:calc(100% - 25px)!important;border-radius:0;resize:none}
.win.full{position:fixed;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none;z-index:4000!important}
.win.full .titlebar{position:absolute;top:0;left:0;right:0;transform:translateY(-100%);transition:transform .25s}
.win.full .hot{position:absolute;top:0;left:0;right:0;height:10px;z-index:5}
.win.full .hot:hover~.titlebar,.win.full .titlebar:hover{transform:none}
.hot{display:none}.win.full .hot{display:block}

/* letter */
.letter{background:#fffdf6 repeating-linear-gradient(transparent 0 27px,rgba(194,24,91,.07) 27px 28px);padding:30px 36px;font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:17px;line-height:28px;color:#4a2c3a;white-space:pre-wrap;min-height:100%}
.letter h1{font-size:25px;line-height:36px;margin-bottom:6px;color:#c2185b;font-weight:700}
.musicbtn{position:sticky;top:0;float:right;border:0;background:rgba(194,24,91,.12);color:#c2185b;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--font)}
.caret{display:inline-block;width:2px;height:1em;background:#c2185b;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* cards */
.card{padding:28px;text-align:center;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.card h2{font-size:22px;font-weight:700}.card p{font-size:14px;opacity:.85;max-width:380px;line-height:1.5}
.btn2{display:inline-block;padding:9px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer;color:#fff;font-family:var(--font)}
.btn2.ghost{background:rgba(255,255,255,.14)!important}
.empty{color:#999;text-align:center;padding:30px;font-size:14px}

/* slideshow */
.show-body{background:#111;display:flex;flex-direction:column;height:100%}
.carousel{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;display:flex;align-items:center;justify-content:center}
.slide.on{opacity:1}
.slide::before{content:"";position:absolute;inset:0;background:var(--bg) center/cover;filter:blur(30px) brightness(.5);transform:scale(1.2)}
.slide img{position:relative;max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(40,40,40,.55);backdrop-filter:blur(10px);color:#fff;font-size:22px;cursor:pointer;z-index:3}
.nav.p{left:10px}.nav.n{right:10px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3;flex-wrap:wrap;padding:0 40px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}
.dots i.on{background:#fff}
.player{flex:none;background:#121212}
.player iframe{display:block;width:100%;height:152px;border:0}

/* spotify app */
.spot{padding:22px;text-align:center;background:linear-gradient(#2a2a2a,#121212 260px);color:#fff;min-height:100%}
.spot h2{margin-bottom:6px}
.spot p{font-size:13px;color:#bbb;margin-bottom:16px}
.spot iframe{width:100%;height:380px;border:0;border-radius:12px;margin-bottom:14px}

/* album / notes / youtube / netflix */
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:3px;padding:3px;background:#fff}
.photos-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.notes{background:#fff9c4;padding:20px 26px;min-height:100%;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;color:#4a3b00}
.notes h2{font-size:20px;margin-bottom:10px}.notes li{margin:0 0 9px 20px;font-size:15px;line-height:1.4}
.yt{background:#0f0f0f;color:#fff;height:100%;display:flex;flex-direction:column}
.yt iframe{flex:1;width:100%;border:0;min-height:0}
.ytbar{display:flex;gap:8px;padding:8px;background:#212121}
.ytbar input{flex:1;padding:7px 14px;border-radius:999px;border:1px solid #444;background:#121212;color:#fff;outline:none;user-select:text;-webkit-user-select:text;font-family:var(--font)}
.ytbar .btn2{padding:6px 14px}
.ytmain{flex:1;overflow:auto;min-height:0;padding:12px 16px}
.ytplayer{aspect-ratio:16/9;max-height:56%;width:100%;margin:0 auto;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ytplayer iframe{width:100%;height:100%;flex:none}
.ytmain h3{margin:10px 0;font-size:17px}
.ytgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.ytcard{cursor:pointer;font-size:14px}
.ytcard .th{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#3a2a4a,#1b1b2b);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px;border:2px solid transparent;color:#fff;font-size:22px}
.ytcard .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ytcard .th span{position:relative;text-shadow:0 1px 6px #000;font-size:15px}
.ytcard.on .th{border-color:#f00}
.ytcard:hover .th{filter:brightness(1.15)}

/* spotify player */
.sp2{padding:0!important;background:#121212!important}
.sp2 .np{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(#3a3a3a,#181818);position:sticky;top:0;z-index:2;text-align:left}
.sp2 .np img{width:84px;height:84px;border-radius:8px;object-fit:cover;background:#282828}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}.mt b,.mt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt small{color:#b3b3b3;font-size:12px}
.ctl{display:flex;gap:6px;align-items:center}
button[data-a]{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
button[data-a].big{background:#1ed760;color:#000;border-radius:50%;width:44px;height:44px}
.tr{display:flex;align-items:center;gap:14px;padding:8px 18px;cursor:pointer;text-align:left}
.tr:hover{background:#2a2a2a}.tr.on b{color:#1ed760}.tr span{width:20px;color:#999;font-size:13px}.tr div{display:flex;flex-direction:column;min-width:0}.tr small{color:#b3b3b3;font-size:12px}
.minibar{display:flex;align-items:center;gap:10px;padding:10px 14px}.minibar img{width:44px;height:44px;border-radius:6px}

/* album */
.album{background:#fff;min-height:100%;position:relative;color:#222}
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;position:fixed}
.lightbox.on{display:flex}
.lightbox img{max-width:92%;max-height:92%;object-fit:contain}
.lightbox .x{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}

/* spotlight */
#spotlight{position:fixed;inset:0;z-index:4500;display:none;align-items:flex-start;justify-content:center;padding-top:18vh}
#spotlight.open{display:flex}
.sl-box{width:min(620px,92vw);border-radius:16px;background:rgba(60,60,66,.62);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border:.5px solid rgba(255,255,255,.25);box-shadow:0 25px 70px rgba(0,0,0,.5);overflow:hidden}
.sl-in{display:flex;align-items:center;gap:12px;padding:14px 18px}
.sl-in input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:22px;font-family:var(--font);user-select:text;-webkit-user-select:text}
.sl-in input::placeholder{color:rgba(255,255,255,.55)}
.sl-res{border-top:.5px solid rgba(255,255,255,.2);padding:6px}
.sl-res div{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;font-size:15px}
.sl-res div.on{background:#0a63d8}
.sl-res svg{width:28px;height:28px}

/* notification */
.notif{position:absolute;top:34px;right:-420px;width:340px;padding:12px 14px;border-radius:18px;background:rgba(235,235,240,.72);color:#1d1d1f;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;gap:11px;z-index:3500;transition:right .55s cubic-bezier(.2,.9,.3,1.1);cursor:default;border:.5px solid rgba(255,255,255,.6)}
.notif.show{right:12px}
.notif .ni{width:38px;height:38px;flex:none}
.notif b{font-size:13px;display:block}
.notif span{font-size:13px;line-height:1.35;display:block;margin-top:1px}
.notif small{position:absolute;top:10px;right:14px;font-size:11px;color:#666}
.widget{top:36px}
@media(max-width:700px){.notif{width:290px}}

/* hearts */
.heart{position:fixed;bottom:-30px;z-index:5;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.tap{position:fixed;z-index:6000;pointer-events:none;font-size:22px;animation:pop .9s forwards}
@keyframes pop{to{transform:translateY(-60px) scale(1.6);opacity:0}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="wall" data-wall></div>
  <div class="login-clock"><div class="d" id="lDate"></div><div class="t" id="lTime"></div></div>
  <div class="login-box" id="box">
    <div class="avatar" id="avatar">💕</div>
    <div class="uname" id="uname"></div>
    <div class="pw-wrap">
      <input id="pw" type="password" placeholder="Enter Password" autocomplete="off" autofocus>
      <button id="go" aria-label="Log in"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5h6M5.5 2L8 5 5.5 8" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="touchid">Hint: what we're celebrating, no spaces</div>
  </div>
  <div class="login-bottom"><div><i>🌙</i>Sleep</div><div><i>↻</i>Restart</div><div><i>⏻</i>Shut Down</div></div>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop">
  <div class="wall" data-wall></div>

/* Turn GitHub / Drive / Google Photos / repo-path inputs into loadable URL candidates */
function urlCandidates(src){
  if(!src) return [];
  const gh = CONFIG.github||{}, raw = gh.user && gh.repo ? `https://raw.githubusercontent.com/${gh.user}/${gh.repo}/${gh.branch||"main"}/` : "";
  let m;
  if((m = src.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/))) return [`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3].split("?")[0]}`];
  if((m = src.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/))) return [`https://lh3.googleusercontent.com/d/${m[1]}=w2000`, `https://drive.google.com/thumbnail?id=${m[1]}&sz=w2000`];
  if(/^https?:\/\//.test(src)) return [src];
  const rel = src.replace(/^\.?\//,"");
  return [rel].concat(raw ? [raw+rel] : []);
}
/* Try each candidate in turn (sources may be a string or array). cb(url) on success, cb(null) if all fail. */
function loadFirst(sources, cb){
  const list = [].concat(sources||[]).flatMap(urlCandidates);
  (function next(i){
    if(i>=list.length) return cb(null);
    const im = new Image(); im.referrerPolicy = "no-referrer";
    im.onload = ()=>cb(list[i]); im.onerror = ()=>next(i+1);
    im.src = list[i];
  })(0);
}
/* Plain <img> markup that survives Google/GitHub hotlink rules */

  $("#cdM").textContent = pad(Math.floor(s%3600/60));
  $("#cdS").textContent = pad(s%60);
}

  const n = dock.querySelectorAll(".app").length;
  BASE = Math.max(34, Math.min(58, Math.floor((innerWidth-50)/(n+1.2)/1.18)));
  dock.querySelectorAll(".app").forEach(a=>a.style.setProperty("--sz",BASE+"px"));
}
sizeDock(); addEventListener("resize", sizeDock);
dock.addEventListener("mousemove", e=>{
  if(coarse) return;
  dock.querySelectorAll(".app").forEach(a=>{
    const r = a.getBoundingClientRect(), c = r.left + r.width/2;
    const s = 1 + 0.75*Math.exp(-((e.clientX-c)**2)/(2*62*62));
    a.style.setProperty("--sz", (BASE*s).toFixed(1)+"px");
  });
});
dock.addEventListener("mouseleave", ()=>dock.querySelectorAll(".app").forEach(a=>a.style.setProperty("--sz",BASE+"px")));

/* ---------- window manager ---------- */
let z = 10, built = {}, activeId = null;
function focusWin(id){
  activeId = id;
  document.querySelectorAll(".win").forEach(w=>w.classList.toggle("inactive", w.id!=="win-"+id));
  const w = $("#win-"+id); if(w) w.style.zIndex = ++z;
  $("#appName").textContent = id ? byId(id).name : "Finder";
}
function openApp(id){
  const a = byId(id);
  let w = document.getElementById("win-"+id);
  const di = $("#dock-"+id);
  if(!w){
    w = document.createElement("div"); w.className = "win"+(a.dark?" dark":""); w.id = "win-"+id;
    const W = Math.min(a.w, innerWidth-16), H = Math.min(a.h, innerHeight-120);
    const off = APPS.indexOf(a)*26;
    w.style.width = W+"px"; w.style.height = H+"px";
    w.style.left = Math.max(8, (innerWidth-W)/2 - 80 + off)+"px";
    w.style.top  = Math.max(34, (innerHeight-H)/2 - 40 + off)+"px";
    w.innerHTML = `<div class="hot"></div><div class="titlebar"><div class="lights"><i class="c" data-g="✕"></i><i class="m" data-g="–"></i><i class="z" data-g="⤢"></i></div><div class="t">${a.name}</div></div><div class="body"></div>`;
    $("#windows").appendChild(w);
    w.querySelector(".c").onclick = e=>{ e.stopPropagation(); closeApp(id); };
    w.querySelector(".m").onclick = e=>{ e.stopPropagation(); minimize(id); };
    w.querySelector(".z").onclick = e=>{ e.stopPropagation(); toggleFull(id); };
    w.querySelector(".titlebar").ondblclick = e=>{ if(!e.target.closest(".lights")) w.classList.toggle("max"); };
    drag(w, w.querySelector(".titlebar"));
    w.addEventListener("mousedown", ()=>focusWin(id));
  }
  let opening = false;
  if(w.classList.contains("minimized")) restore(id);
  else if(!w.classList.contains("open")){
    opening = true;
    w.classList.add("open");
    di.classList.add("open");
    di.classList.remove("bounce"); void di.offsetWidth; di.classList.add("bounce");
  }
  focusWin(id);
  if(!built[id]){ built[id]=true; a.build(w.querySelector(".body")); }
  if(id==="letter") startLetter();
  if(opening && a.popup) launchPopup(a.popup());
}
function closeApp(id){
  if(id==="letter" && letterAudio) letterAudio.pause();
  const w = $("#win-"+id);
  if(w.classList.contains("full")) toggleFull(id);
  w.classList.remove("open","max","minimized","mini-anim");
  removeMini(id);
  $("#dock-"+id).classList.remove("open");
  if(activeId===id) focusWin(null);
}
function minimize(id){
  const w = $("#win-"+id), di = $("#dock-"+id);
  if(w.classList.contains("full")) toggleFull(id);
  const wr = w.getBoundingClientRect(), dr = di.getBoundingClientRect();
  w.style.transformOrigin = `${dr.left+dr.width/2-wr.left}px ${dr.top+dr.height/2-wr.top}px`;
  w.classList.add("mini-anim");
  setTimeout(()=>{
    w.classList.remove("open"); w.classList.add("minimized");
    const m = dockItem(ICON[byId(id).icon](), byId(id).name, ()=>openApp(id), "mini-"+id);
    m.classList.add("mini"); m.style.setProperty("--sz",BASE+"px");
    miniWrap.appendChild(m); syncSep();
  }, 430);
  if(activeId===id) focusWin(null);
}
function restore(id){
  const w = $("#win-"+id);
  removeMini(id);
  w.classList.remove("minimized"); w.classList.add("open");
  void w.offsetWidth;
  w.classList.remove("mini-anim");
  w.style.transformOrigin = "";
  focusWin(id);
}
function removeMini(id){ const m = $("#mini-"+id); if(m) m.remove(); syncSep(); }
function toggleFull(id){
  const w = $("#win-"+id);
  if(w.classList.contains("full")){
    w.classList.remove("full"); document.body.classList.remove("fs");
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  } else {
    w.classList.add("full"); document.body.classList.add("fs"); focusWin(id);
    const el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  }
}
document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement){ document.querySelectorAll(".win.full").forEach(w=>w.classList.remove("full")); document.body.classList.remove("fs"); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ document.querySelectorAll(".win.full").forEach(w=>toggleFull(w.id.slice(4))); closeSpotlight(); }
});
function drag(win, bar){
  bar.addEventListener("pointerdown", e=>{
    if(e.target.closest(".lights") || win.classList.contains("max") || win.classList.contains("full")) return;
    const sx = e.clientX-win.offsetLeft, sy = e.clientY-win.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const mv = ev=>{ win.style.left=(ev.clientX-sx)+"px"; win.style.top=Math.max(25,ev.clientY-sy)+"px"; };
    const up = ()=>{ bar.removeEventListener("pointermove",mv); bar.removeEventListener("pointerup",up); };
    bar.addEventListener("pointermove",mv); bar.addEventListener("pointerup",up);
  });
}

function openSpotlight(){ $("#spotlight").classList.add("open"); $("#slq").value=""; slSel=0; renderSpotlight(); setTimeout(()=>$("#slq").focus(),30); }
function closeSpotlight(){ $("#spotlight").classList.remove("open"); }

$("#spotlight").onmousedown = e=>{ if(e.target.id==="spotlight") closeSpotlight(); };

$("#slq").onkeydown = e=>{
  if(e.key==="ArrowDown"){ slSel=Math.min(slList.length-1,slSel+1); renderSpotlight(); e.preventDefault(); }

document.addEventListener("keydown", e=>{

/* ---------- spotify embed ---------- */
function spotifyEmbed(link){
  const m = link.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/);
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0` : null;
}
const embedUrl = spotifyEmbed(CONFIG.spotifyLink);
function playerHTML(h){
  return embedUrl
    ? `<iframe src="${embedUrl}" height="${h}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
    : `<div class="empty">Add your Spotify link in CONFIG.spotifyLink</div>`;
}

/* ---------- spotify API (PKCE login + Web Playback SDK, all in-tab) ---------- */
const SP = {player:null, deviceId:null, token:null, state:null, tracks:[], listeners:[]};
const SP_KEY = "sp_auth";
const SP_REDIRECT = location.origin + location.pathname;
const spUse = !!CONFIG.spotifyClientId;
const spPlaylistId = (CONFIG.spotifyLink.match(/playlist\/([A-Za-z0-9]+)/)||[])[1];
const spNotify = ()=>SP.listeners.forEach(f=>f());
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  sessionStorage.setItem("sp_verifier", verifier);
  sessionStorage.setItem("sp_return","1");
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: CONFIG.spotifyClientId, response_type:"code", redirect_uri: SP_REDIRECT,
    code_challenge_method:"S256", code_challenge: challenge,
    scope:"streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative"
  });
}
async function spTokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({client_id:CONFIG.spotifyClientId, ...params})});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error);
  const prev = JSON.parse(localStorage.getItem(SP_KEY)||"{}");
  const auth = {access:j.access_token, refresh:j.refresh_token||prev.refresh, exp:Date.now()+j.expires_in*1000-60000};
  localStorage.setItem(SP_KEY, JSON.stringify(auth));
  return auth;
}
async function spToken(){
  let a = JSON.parse(localStorage.getItem(SP_KEY)||"null");
  if(!a) return null;
  if(Date.now() > a.exp){
    try{ a = await spTokenRequest({grant_type:"refresh_token", refresh_token:a.refresh}); }
    catch(e){ localStorage.removeItem(SP_KEY); return null; }
  }
  return a.access;
}
async function spApi(path, opt={}){
  const t = await spToken(); if(!t) throw new Error("Not signed in");
  const r = await fetch("https://api.spotify.com/v1"+path, {...opt, headers:{Authorization:"Bearer "+t, "Content-Type":"application/json"}});
  if(r.status===204) return null;
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&j.error&&j.error.message)||r.status);
  return j;
}
/* Returning from Spotify's login page */
async function spHandleReturn(){
  const q = new URLSearchParams(location.search), code = q.get("code");
  if(q.get("error")){
    SP.error = "Spotify login failed: " + q.get("error");
    history.replaceState({}, "", location.pathname);
    if(sessionStorage.getItem("unlocked")){ unlock(true); openApp("spotify"); }
    return;
  }
  if(!code || !sessionStorage.getItem("sp_verifier")) return;
  try{
    await spTokenRequest({grant_type:"authorization_code", code, redirect_uri:SP_REDIRECT, code_verifier:sessionStorage.getItem("sp_verifier")});
  }catch(e){ SP.error = e.message; }
  sessionStorage.removeItem("sp_verifier");
  history.replaceState({}, "", location.pathname);
  if(sessionStorage.getItem("unlocked")) { unlock(true); openApp("spotify"); }
}
function spLoadSdk(){
  if(SP.player || SP.sdkLoading || !localStorage.getItem(SP_KEY)) return;
  SP.sdkLoading = true;
  window.onSpotifyWebPlaybackSDKReady = ()=>{
    SP.player = new Spotify.Player({name:"Our Anniversary Desktop", volume:.7, getOAuthToken: async cb=>cb(await spToken())});
    SP.player.addListener("ready", ({device_id})=>{ SP.deviceId = device_id; spNotify(); });
    SP.player.addListener("player_state_changed", s=>{ SP.state = s; spNotify(); });
    ["initialization_error","authentication_error","account_error","playback_error"].forEach(ev=>SP.player.addListener(ev, e=>{ SP.error = ev==="account_error" ? "Spotify Premium is required for in-tab playback." : e.message; spNotify(); }));
    SP.player.connect();
  };
  const s = document.createElement("script"); s.src = "https://sdk.scdn.co/spotify-player.js"; document.head.appendChild(s);
}
async function spLoadTracks(){
  if(!spPlaylistId || SP.tracks.length) return;
  let j;
  try{ j = await spApi(`/playlists/${spPlaylistId}/items?limit=100`); }
  catch(e){ j = await spApi(`/playlists/${spPlaylistId}/tracks?limit=100`); }
  SP.tracks = (j.items||[]).map(i=>i.track||i.item).filter(t=>t && t.uri);
  spNotify();
}
async function spPlay(opts){
  if(!SP.deviceId) throw new Error("Player is still connecting…");
  SP.player.activateElement && SP.player.activateElement();
  await spApi("/me/player/play?device_id="+SP.deviceId, {method:"PUT", body:JSON.stringify(opts)});
}
const spSignedIn = ()=>!!localStorage.getItem(SP_KEY);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- letter ---------- */
let typing = null, typed = false, letterAudio = null;
function buildLetter(body){
  body.innerHTML = `<div class="letter"><button class="musicbtn" id="mbtn">🔊 Music</button><h1 id="lt"></h1><span id="ltxt"></span><span class="caret"></span></div>`;
  if(CONFIG.letterMusic){
    letterAudio = new Audio(CONFIG.letterMusic); letterAudio.loop = true; letterAudio.volume = CONFIG.letterMusicVolume;
    letterAudio.onerror = ()=>{ $("#mbtn").textContent = "🔇 (music file not found)"; };
  } else $("#mbtn").style.display = "none";
  $("#mbtn").onclick = ()=>{
    if(!letterAudio) return;
    if(letterAudio.paused){ letterAudio.play(); $("#mbtn").textContent="🔊 Music"; }
    else { letterAudio.pause(); $("#mbtn").textContent="🔇 Music"; }
  };
}
function startLetter(){
  if(letterAudio && letterAudio.paused && $("#mbtn").textContent.startsWith("🔊")) letterAudio.play().catch(()=>{});
  if(typed) return; typed = true;
  const title = $("#lt"), txt = $("#ltxt");
  const full = [...CONFIG.letterTitle], body = [...CONFIG.letter];
  let i = 0, j = 0;
  typing = setInterval(()=>{
    if(i < full.length){ title.textContent += full[i++]; return; }
    if(j < body.length){ txt.textContent += body[j++]; $("#win-letter .body").scrollTop = 1e6; return; }
    clearInterval(typing); document.querySelector(".caret").style.display="none";
  }, 55);
}

/* ---------- slideshow ---------- */
let slideIdx = 0, slideTimer = null, slides = [], dots = [];
function buildSlides(body){
  body.innerHTML = `<div class="show-body"><div class="carousel" id="car"></div><div class="player" id="slidePlayer"></div></div>`;
  if(spUse && spSignedIn()){
    const sp = $("#slidePlayer"); sp.innerHTML = `<div class="minibar"></div>`;
    const draw = ()=>{ const s = SP.state, t = s && s.track_window.current_track;
      sp.firstChild.innerHTML = t ? `<img src="${t.album.images[0].url}" alt=""><div class="mt"><b>${esc(t.name)}</b><small>${esc(t.artists.map(a=>a.name).join(", "))}</small></div><button data-a="prev">⏮</button><button data-a="toggle">${s.paused?"▶":"⏸"}</button><button data-a="next">⏭</button>` : `<div class="mt"><small>Open the Spotify app on the desktop and press play 🎶</small></div>`; };
    sp.onclick = e=>{ const a = e.target.dataset.a; if(!a||!SP.player) return; ({prev:()=>SP.player.previousTrack(), toggle:()=>SP.player.togglePlay(), next:()=>SP.player.nextTrack()})[a](); };
    SP.listeners.push(draw); draw(); spLoadSdk();
  } else $("#slidePlayer").innerHTML = embedUrl ? playerHTML(152) : "";
  const car = $("#car");
  if(!CONFIG.images.length){ car.innerHTML = `<div class="empty">Add photos in CONFIG.images</div>`; return; }
  CONFIG.images.forEach(src=>{
    const s = document.createElement("div"); s.className="slide";
    s.innerHTML = `<div class="empty" style="position:relative">Loading…</div>`;
    loadFirst(src, url=>{
      if(!url){ s.innerHTML = `<div class="empty" style="position:relative">Couldn't load<br>${esc(src)}</div>`; return; }
      s.style.setProperty("--bg",`url("${url}")`);
      s.innerHTML = `<img src="${url}" referrerpolicy="no-referrer" alt="">`;
    });
    car.appendChild(s); slides.push(s);
  });
  car.insertAdjacentHTML("beforeend", `<button class="nav p">‹</button><button class="nav n">›</button><div class="dots"></div>`);
  const dc = car.querySelector(".dots");
  CONFIG.images.forEach((_,i)=>{ const d=document.createElement("i"); d.onclick=()=>{go(i);reset();}; dc.appendChild(d); dots.push(d); });
  car.querySelector(".p").onclick = ()=>{go(slideIdx-1);reset();};
  car.querySelector(".n").onclick = ()=>{go(slideIdx+1);reset();};
  go(0); reset();
}
function go(i){
  slideIdx = (i+slides.length)%slides.length;
  slides.forEach((s,k)=>{ s.classList.toggle("on",k===slideIdx); dots[k].classList.toggle("on",k===slideIdx); });
}
function reset(){ clearInterval(slideTimer); slideTimer=setInterval(()=>go(slideIdx+1), CONFIG.slideSeconds*1000); }

/* ---------- spotify app ---------- */
function buildSpotify(body){
  if(!spUse){
    body.innerHTML = `<div class="spot"><h2>Our Playlist 🎶</h2><p>Add your Client ID in CONFIG.spotifyClientId for full in-tab playback. Showing the basic player for now.</p>${playerHTML(380)}</div>`;
    return;
  }
  if(!spSignedIn()){
    const bad = location.protocol==="file:";
    body.innerHTML = `<div class="spot"><h2>Our Playlist 🎶</h2><p>Connect your Spotify Premium account to play full songs right here.</p><button class="btn2" id="spIn" style="background:#1ed760;color:#000">Connect Spotify</button><p style="margin-top:16px;font-size:12px;line-height:1.5">In the <b>Spotify Developer Dashboard</b> → your app → Settings → Redirect URIs, add exactly:<br><code style="user-select:text;color:#1ed760">${esc(SP_REDIRECT)}</code></p>${bad?`<p style="color:#ffb4b4;font-size:12px">You opened this as a local file. Spotify doesn't accept file:// addresses. Host it (GitHub Pages) or run <code>python -m http.server 8888</code> in this folder and open <code>http://127.0.0.1:8888/</code>, then register that address.</p>`:""}<div class="empty" id="spErr" style="color:#ffb4b4">${esc(SP.error||"")}</div></div>`;
    $("#spIn").onclick = ()=>{ if(bad){ $("#spErr").textContent = "Open this page from https:// or http://127.0.0.1 first (see above)."; return; } spLogin().catch(e=>{ $("#spErr").textContent = e.message; }); };
    return;
  }
  body.innerHTML = `<div class="spot sp2"><div class="np"></div><div class="tl"></div><div class="empty" id="spErr"></div></div>`;
  const np = body.querySelector(".np"), tl = body.querySelector(".tl");
  const draw = ()=>{
    const s = SP.state, t = s && s.track_window.current_track;
    np.innerHTML = `<img src="${t?t.album.images[0].url:""}" alt=""><div class="mt"><b>${t?esc(t.name):"Nothing playing"}</b><small>${t?esc(t.artists.map(a=>a.name).join(", ")):(SP.deviceId?"Pick a song below":"Connecting player…")}</small></div><div class="ctl"><button data-a="prev">⏮</button><button data-a="toggle" class="big">${s&&!s.paused?"⏸":"▶"}</button><button data-a="next">⏭</button></div>`;
    tl.innerHTML = SP.tracks.length ? SP.tracks.map((x,i)=>`<div class="tr${t&&t.uri===x.uri?" on":""}" data-i="${i}"><span>${i+1}</span><div><b>${esc(x.name)}</b><small>${esc((x.artists||[]).map(a=>a.name).join(", "))}</small></div></div>`).join("") : `<div class="empty">${spPlaylistId?"Loading playlist…":"Add your playlist link in CONFIG.spotifyLink"}</div>`;
    $("#spErr").textContent = SP.error||"";
  };
  body.onclick = async e=>{
    try{
      const a = e.target.dataset.a, tr = e.target.closest(".tr");
      if(a && SP.player){ if(!SP.state && a==="toggle" && spPlaylistId) await spPlay({context_uri:`spotify:playlist:${spPlaylistId}`}); else ({prev:()=>SP.player.previousTrack(), toggle:()=>SP.player.togglePlay(), next:()=>SP.player.nextTrack()})[a](); }
      else if(tr) await spPlay({context_uri:`spotify:playlist:${spPlaylistId}`, offset:{position:+tr.dataset.i}});
    }catch(err){ SP.error = err.message; draw(); }
  };
  SP.listeners.push(draw); draw();
  spLoadSdk(); spLoadTracks().catch(e=>{ SP.error = "Couldn't load playlist: "+e.message; draw(); });
}

/* ---------- google photos album ---------- */
function buildAlbum(body){
  const prev = CONFIG.albumPreviewImages.map(s=>`<img src="${esc(imgSrc(s))}" referrerpolicy="no-referrer" alt="">`).join("");
  body.innerHTML = `<div class="album"><div id="albWidget" style="padding:10px"><div class="empty">Loading our album…</div></div>${prev?`<div class="photos-grid">${prev}</div>`:""}<div class="lightbox" id="lb"><button class="x">✕</button><button class="nav p">‹</button><button class="nav n">›</button><img alt="" referrerpolicy="no-referrer"></div></div>`;
  const imgs = [...body.querySelectorAll(".photos-grid img")], lb = body.querySelector("#lb"); let cur = 0;
  const show = i=>{ cur = (i+imgs.length)%imgs.length; lb.querySelector("img").src = imgs[cur].src; lb.classList.add("on"); };
  imgs.forEach((im,i)=>im.onclick = ()=>show(i));
  lb.querySelector(".x").onclick = ()=>lb.classList.remove("on");
  lb.querySelector(".p").onclick = e=>{ e.stopPropagation(); show(cur-1); };
  lb.querySelector(".n").onclick = e=>{ e.stopPropagation(); show(cur+1); };
  lb.onclick = e=>{ if(e.target===lb) lb.classList.remove("on"); };
  loadPublicAlbum(body.querySelector("#albWidget"));
}
/* publicalbum.org carousel: the embed snippet lives in album-embed.html (saved from publicalbum.org) */
async function loadPublicAlbum(host){
  try{
    const r = await fetch(CONFIG.albumEmbedFile, {cache:"no-cache"});
    if(!r.ok) throw new Error(r.status);
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const w = doc.querySelector(".pa-carousel-widget, .pa-gallery-player-widget, [class^='pa-'][class$='-widget']");
    if(!w) throw new Error("no widget in file");
    const node = document.importNode(w, true);
    node.style.display = ""; node.style.width = "100%"; node.style.height = "calc(100vh - 160px)"; node.style.minHeight = "360px";
    host.innerHTML = ""; host.appendChild(node);
    if(!document.getElementById("pa-script")){
      const sc = document.createElement("script"); sc.id = "pa-script"; sc.async = true;
      sc.src = "https://cdn.jsdelivr.net/npm/publicalbum@latest/embed-ui.min.js"; document.head.appendChild(sc);
    } else if(window.publicalbum && window.publicalbum.init) window.publicalbum.init();
  }catch(e){
    host.innerHTML = `<div class="empty">Couldn't load <code>${esc(CONFIG.albumEmbedFile)}</code> (${esc(e.message)}).<br>Save your publicalbum.org embed code into that file next to index.html and open the site over http(s), not as a local file.</div>`;
  }
}

/* ---------- notes ---------- */
function buildNotes(body){
  body.innerHTML = `<div class="notes"><h2>Reasons I love you 💛</h2><ul>${CONFIG.reasons.map(r=>`<li>${r}</li>`).join("")}</ul></div>`;
}

/* ---------- youtube ---------- */
function driveId(s){
  s = String(s||"").trim();
  const m = s.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);
  return m ? (m[1]||m[2]) : (/^[\w-]{20,}$/.test(s) ? s : "");
}
function buildYouTube(body){
  const v = CONFIG.vlogs.slice(0,6).map(x=>({title:x.title, id:driveId(x.drive)}));
  body.innerHTML = `<div class="yt"><div class="ytbar"><b style="color:#f00;font-size:18px;letter-spacing:-.5px">▶ Our Vlogs</b></div><div class="ytmain"><div class="ytplayer" id="ytp"><div class="empty">Pick a vlog below ⬇</div></div><h3 id="ytt"></h3><div class="ytgrid">${v.map((x,i)=>`<div class="ytcard" data-i="${i}"><div class="th">${x.id?`<img src="https://drive.google.com/thumbnail?id=${x.id}&sz=w480" referrerpolicy="no-referrer" alt="">`:""}<span>${x.id?"▶":"Coming soon"}</span></div><b>${esc(x.title)}</b></div>`).join("")}</div></div></div>`;
  const cards = [...body.querySelectorAll(".ytcard")];
  const play = i=>{
    cards.forEach((c,k)=>c.classList.toggle("on",k===i));
    $("#ytt").textContent = v[i].title;
    $("#ytp").innerHTML = v[i].id ? `<iframe src="https://drive.google.com/file/d/${v[i].id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>` : `<div class="empty">"${esc(v[i].title)}" is coming soon 💕</div>`;
  };
  cards.forEach((c,i)=>c.onclick = ()=>play(i));
  play(Math.max(0, v.findIndex(x=>x.id)));
}

/* ---------- prime ---------- */
/* Netflix / Prime refuse to be embedded in any page, so opening the app launches them in a small app window */
function launchPopup(url){
  const w = 980, h = 640;
  const l = Math.round(screenX + (innerWidth - w)/2), t = Math.round(screenY + (innerHeight - h)/2);
  const p = window.open(url, "popup_"+btoa(url).slice(-8), `popup=yes,width=${w},height=${h},left=${l},top=${t},resizable=yes,scrollbars=yes`);
  if(!p) window.open(url, "_blank");
  return p;
}
function streamCard(body, url, logo, title, blurb, bg){
  body.innerHTML = `<div class="card" style="background:${bg};color:#fff">${logo}<h2>${title}</h2><p>${blurb}</p><button class="btn2" style="background:#e50914" id="relaunch">Open ${title}</button></div>`;
  body.querySelector("#relaunch").onclick = ()=>launchPopup(url);
}
function buildPrime(body){ streamCard(body, CONFIG.primeUrl, `<div style="font-size:28px;font-weight:800">prime <span style="color:#00a8e1">video</span></div>`, "Prime Video", `We need to finish ${esc(CONFIG.primeShow)} 💛💙 It opens in its own app window, since Prime Video can't run inside another page.`, "linear-gradient(160deg,#0f171e,#1b2a3a)"); }
function buildNetflix(body){ streamCard(body, CONFIG.netflixUrl, `<div style="font-size:36px;font-weight:900;color:#e50914;letter-spacing:3px;font-family:Impact,'Arial Black',sans-serif">NETFLIX</div>`, "Netflix", "Netflix opens in its own app window, since it can't run inside another page.", "#141414"); }

spHandleReturn();

/* ---------- hearts ---------- */
setInterval(()=>{
  if(!$("#desktop").classList.contains("show")) return;
  const h = document.createElement("div"); h.className="heart";
  h.textContent = ["💗","💕","💖","❤️","✨"][Math.floor(Math.random()*5)];
  h.style.left = Math.random()*100+"vw"; h.style.fontSize = (14+Math.random()*18)+"px";
  h.style.animationDuration = (7+Math.random()*6)+"s"; h.style.opacity=.7;
  document.body.appendChild(h); setTimeout(()=>h.remove(),14000);
}, 1100);
document.addEventListener("click", e=>{
  if(!$("#desktop").classList.contains("show")) return;
  const t = document.createElement("div"); t.className="tap"; t.textContent="💖";
  t.style.left=e.clientX+"px"; t.style.top=e.clientY+"px";
  document.body.appendChild(t); setTimeout(()=>t.remove(),900);
});
</script>
